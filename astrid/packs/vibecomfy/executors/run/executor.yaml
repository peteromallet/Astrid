{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.vibecomfy.executors.run.run",
      "run",
      "{workflow}",
      "--python",
      "{python}",
      "--companion",
      "{companion}",
      "--source",
      "{source}",
      "--out",
      "{out}",
      "--task-identity",
      "{task_identity}",
      "--attempt-identity",
      "{attempt_identity}",
      "--execution-identity",
      "{execution_identity}",
      "--readiness-profile-path",
      "{readiness_profile_path}",
      "--readiness-profile-hash",
      "{readiness_profile_hash}",
      "--source-video",
      "{source_video}",
      "--source-video-node",
      "{source_video_node}",
      "--source-video-widget",
      "{source_video_widget}",
      "--managed-assets",
      "{managed_assets}",
      "--workflow-inputs",
      "{workflow_inputs}",
      "--output-contract",
      "{output_contract}"
    ],
    "env": {
      "VIBECOMFY_HEADLESS": "1"
    }
  },
  "description": "Run a VibeComfy workflow through the VibeComfy CLI with readiness-attested ComfyUI or an explicitly approved T9 CPU model-boundary substitute.",
  "graph": {
    "consumes": [
      "workflow",
      "python",
      "companion",
      "source",
      "source_video",
      "managed_assets"
    ],
    "provides": [
      "vibecomfy_run",
      "result_manifest"
    ]
  },
  "id": "vibecomfy.run",
  "inputs": [
    {
      "default": "",
      "description": "Optional VibeComfy UI workflow JSON. Use this or all three canonical members.",
      "name": "workflow",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional managed source video staged into the Comfy input directory.",
      "name": "source_video",
      "required": false,
      "type": "file"
    },
    {
      "default": "99",
      "description": "Node id receiving the managed source video basename.",
      "name": "source_video_node",
      "required": false,
      "type": "string"
    },
    {
      "default": "video",
      "description": "Input field on the source-video node.",
      "name": "source_video_widget",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Optional deterministic ZIP containing manifest.json and runtime-managed workflow media inputs.",
      "name": "managed_assets",
      "required": false,
      "type": "file"
    },
    {
      "default": "{}",
      "description": "JSON object of scalar public workflow inputs. Media inputs are supplied by managed_assets.",
      "name": "workflow_inputs",
      "required": false,
      "type": "string"
    },
    {
      "default": "{}",
      "description": "Validated H3 raw-inference output contract.",
      "name": "output_contract",
      "required": false,
      "type": "string"
    },
    {
      "default": "",
      "description": "Optional canonical workflow.py member.",
      "name": "python",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional canonical workflow.vibe.json companion member.",
      "name": "companion",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional byte-identical source.json member.",
      "name": "source",
      "required": false,
      "type": "file"
    },
    {
      "description": "Host-issued task identity for the production engine adapter.",
      "name": "task_identity",
      "required": false,
      "type": "string"
    },
    {
      "description": "Host-issued attempt identity for stale-result fencing.",
      "name": "attempt_identity",
      "required": false,
      "type": "string"
    },
    {
      "description": "Host-issued canonical workflow execution identity.",
      "name": "execution_identity",
      "required": false,
      "type": "string"
    },
    {
      "description": "Worker-issued readiness profile path for owned checkout execution.",
      "name": "readiness_profile_path",
      "required": false,
      "type": "string"
    },
    {
      "description": "Hash paired with the Worker-issued readiness profile.",
      "name": "readiness_profile_hash",
      "required": false,
      "type": "string"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "requirements": [
      "vibecomfy"
    ]
  },
  "keywords": [
    "comfyui",
    "vibecomfy",
    "workflow",
    "image",
    "video",
    "generate",
    "run"
  ],
  "kind": "external",
  "metadata": {
    "catalog_source": "none_declared",
    "cli_module": "vibecomfy.cli",
    "command_names": [
      "run",
      "validate"
    ],
    "homepage": "https://github.com/peteromallet/VibeComfy",
    "network_behavior": {
      "run": true,
      "validate": false
    },
    "nodes": [],
    "pack_id": "vibecomfy",
    "prompts": [],
    "requirements": [
      "vibecomfy"
    ],
    "requirements_source": "requirements.txt",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.vibecomfy.executors.run.run",
    "output_result_manifest": true,
    "vibecomfy_command": "run",
    "workflow_input_contract": {
      "description": "UI JSON or complete canonical Python/companion/source sibling bundle.",
      "format": "ComfyUI/VibeComfy workflow JSON or canonical bundle",
      "name": "workflow",
      "required": false,
      "type": "file"
    },
    "workflows": [],
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["127.0.0.1:8188"],"allow_redirects":false}},
  "name": "VibeComfy Run",
  "outputs": [
    {
      "description": "Workflow result files identified by receipt entries.",
      "mode": "create_or_replace",
      "name": "vibecomfy_run",
      "type": "file"
    },
    {
      "description": "Universal result manifest for this workflow run.",
      "mode": "create_or_replace",
      "name": "result_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file"
    }
  ],
  "short_description": "Run a VibeComfy / ComfyUI workflow and settle its artifact inventory.",
  "version": "0.1.0"
}
