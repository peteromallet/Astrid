{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.vibecomfy.executors.run.run",
      "run",
      "{workflow}",
      "--python",
      "{python}",
      "--companion",
      "{companion}",
      "--source",
      "{source}",
      "--out",
      "{out}"
    ]
  },
  "description": "Run a VibeComfy workflow through the VibeComfy CLI.",
  "graph": {
    "consumes": [
      "workflow",
      "python",
      "companion",
      "source"
    ],
    "provides": [
      "vibecomfy_run",
      "result_manifest"
    ]
  },
  "id": "vibecomfy.run",
  "inputs": [
    {
      "default": "",
      "description": "Optional VibeComfy UI workflow JSON. Use this or all three canonical members.",
      "name": "workflow",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional canonical workflow.py member.",
      "name": "python",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional canonical workflow.vibe.json companion member.",
      "name": "companion",
      "required": false,
      "type": "file"
    },
    {
      "default": "",
      "description": "Optional byte-identical source.json member.",
      "name": "source",
      "required": false,
      "type": "file"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "requirements": [
      "vibecomfy"
    ]
  },
  "keywords": [
    "comfyui",
    "vibecomfy",
    "workflow",
    "image",
    "video",
    "generate",
    "run"
  ],
  "kind": "external",
  "metadata": {
    "catalog_source": "none_declared",
    "cli_module": "vibecomfy.cli",
    "command_names": [
      "run",
      "validate"
    ],
    "homepage": "https://github.com/peteromallet/VibeComfy",
    "network_behavior": {
      "run": true,
      "validate": false
    },
    "nodes": [],
    "pack_id": "vibecomfy",
    "prompts": [],
    "requirements": [
      "vibecomfy"
    ],
    "requirements_source": "requirements.txt",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.vibecomfy.executors.run.run",
    "output_result_manifest": true,
    "vibecomfy_command": "run",
    "workflow_input_contract": {
      "description": "UI JSON or complete canonical Python/companion/source sibling bundle.",
      "format": "ComfyUI/VibeComfy workflow JSON or canonical bundle",
      "name": "workflow",
      "required": false,
      "type": "file"
    },
    "workflows": [],
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["127.0.0.1:8188"],"allow_redirects":false}},
  "name": "VibeComfy Run",
  "outputs": [
    {
      "description": "Workflow result files identified by receipt entries.",
      "mode": "create_or_replace",
      "name": "vibecomfy_run",
      "type": "file"
    },
    {
      "description": "Universal result manifest for this workflow run.",
      "mode": "create_or_replace",
      "name": "result_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file"
    }
  ],
  "short_description": "Run a VibeComfy / ComfyUI workflow and settle its artifact inventory.",
  "version": "0.1.0"
}
