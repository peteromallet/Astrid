{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.fal.executors.fal_foley.run",
      "--clip",
      "{clip}",
      "--prompt",
      "{prompt}",
      "--out",
      "{out}/audio.wav"
    ]
  },
  "description": "Generate Foley audio for one short video clip via fal.ai's hunyuan-video-foley model. Takes a clip + text prompt, returns one audio file matched to the clip's duration.",
  "id": "fal.fal_foley",
  "inputs": [
    {
      "description": "Video clip to score with Foley audio (mp4/mov/webm, <=15s recommended).",
      "name": "clip",
      "required": true,
      "type": "file"
    },
    {
      "description": "Text description of the Foley to generate.",
      "name": "prompt",
      "required": true,
      "type": "string",
      "artifact_type": "prompt"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "fal",
    "foley",
    "audio",
    "video",
    "hunyuan",
    "generate"
  ],
  "kind": "external",
  "metadata": {
    "env": [
      "FAL_KEY"
    ],
    "fal_model_id": "fal-ai/hunyuan-video-foley",
    "pricing": "$0.10 per 10s of input video",
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.fal.executors.fal_foley.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["queue.fal.run:443","fal.run:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "name": "fal Hunyuan-Video Foley",
  "outputs": [
    {
      "name": "audio",
      "path_template": "{out}/audio.wav",
      "type": "file",
      "artifact_type": "audio",
      "mode": "create_or_replace"
    },
    {
      "name": "audio_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file",
      "artifact_type": null,
      "mode": "create_or_replace"
    }
  ],
  "scoped_configs": ["credentials.fal"],
  "short_description": "Generate Foley audio for one short video clip via fal.ai's hunyuan-video-foley model.",
  "version": "0.1.0"
}
