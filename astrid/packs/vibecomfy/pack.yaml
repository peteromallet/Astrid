schema_version: 2
id: vibecomfy
name: Astrid VibeComfy
version: 1.0.0
status: active
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs ComfyUI and VibeComfy workflow executors.
  - id: network
    reason: May download models and access network during ComfyUI workflow setup.
  - id: project_files
    reason: Reads workflow JSON files and writes generated outputs.
  - id: accelerator
    reason: May use GPU for ComfyUI model inference.
description: Import, inspect, edit, validate, and run ComfyUI / VibeComfy workflows using canonical editable bundles.
keywords:
- comfyui
- vibecomfy
- workflow
- generate
- image
- video
- gpu
- runpod
capabilities:
- import_workflow
- inspect_workflow_ir
- edit_workflow_ir
- run_workflow
- validate_workflow
- video_enhance
- character_animation
agent:
  purpose: Choose this pack to import, inspect, typed-edit or capture, validate, or execute a ComfyUI/VibeComfy workflow.
  do_not_use_for: Do not use to understand existing media (use understanding) or to cut/render timelines (use video_editing); it runs workflow graphs, not editorial pipelines.
  normal_entrypoints:
  - vibecomfy.import
  - vibecomfy.inspect
  - vibecomfy.edit
  - vibecomfy.run
  - vibecomfy.validate
  - vibecomfy.video_enhance
  - vibecomfy.character_animation
content:
  executors: executors
documentation:
  kind: skill
  path: skill/SKILL.md
