{
  "schema_version": 1,
  "id": "vibecomfy.import",
  "name": "VibeComfy Import",
  "kind": "external",
  "version": "1.0.0",
  "short_description": "Import a ComfyUI workflow into VibeComfy's canonical editable bundle.",
  "description": "Record an origin workflow by preserving its exact source JSON and emitting the canonical Python/companion pair plus an origin report.",
  "keywords": ["comfyui", "vibecomfy", "workflow", "import", "origin"],
  "inputs": [
    {"name": "source", "type": "file", "required": true, "artifact_type": "application/json", "description": "Immutable raw ComfyUI workflow JSON admitted to this task."},
    {"name": "workflow_id", "type": "string", "required": true, "description": "Stable workflow identity used by subsequent edit and capture tasks."}
  ],
  "outputs": [
    {"name": "python", "type": "file", "path_template": "{out}/workflow.py", "artifact_type": "text/x-python", "description": "Canonical editable VibeComfy workflow source."},
    {"name": "companion", "type": "file", "path_template": "{out}/workflow.vibe.json", "artifact_type": "application/json", "description": "Canonical revision and UI identity companion for workflow.py."},
    {"name": "source", "type": "file", "path_template": "{out}/source.json", "artifact_type": "application/json", "description": "Byte-identical admitted source workflow JSON."},
    {"name": "report", "type": "file", "path_template": "{out}/edit-report.json", "artifact_type": "vibecomfy/workflow-transition-report", "description": "Origin identity, readiness, parent lineage, revision, and exact member digests."}
  ],
  "command": {
    "argv": ["{python_exec}", "-m", "astrid.packs.vibecomfy.executors.import.run", "--source", "{source}", "--workflow-id", "{workflow_id}", "--out", "{out}"]
  },
  "cache": {"mode": "none"},
  "conditions": [{"kind": "requires_input", "input": "source"}],
  "graph": {"consumes": ["source", "workflow_id"], "provides": ["vibecomfy_canonical_bundle", "vibecomfy_workflow_transition_report"]},
  "isolation": {"mode": "subprocess", "network": false, "requirements": ["vibecomfy"]},
  "metadata": {
    "pack_id": "vibecomfy",
    "runtime_module": "astrid.packs.vibecomfy.executors.import.run",
    "runtime_file": "run.py",
    "vibecomfy_command": "import_origin",
    "authority": "input_source_json",
    "transition_kind": "origin",
    "mutation": "canonical_bundle_origin",
    "service": "vibecomfy.porting.import_service.import_workflow_bytes",
    "network": false,
    "outputs_are_atomic": true
  }
}
