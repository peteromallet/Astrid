{
  "schema_version": 1,
  "cache": {"mode": "none"},
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.generation.executors.generate_image.run",
      "--model", "{model}",
      "--mode", "{mode}",
      "--execution", "{execution}",
      "--storage-policy-version", "astrid.cloud-edit.unified.v1",
      "--prompt", "{prompt}",
      "--image-ref", "{image_ref}",
      "--count", "{count}",
      "--size", "{size}",
      "--seed", "{seed}",
      "--out", "{out}"
    ],
    "input_args": [
      {"input": "mask_ref", "flag": "--mask-ref", "optional": true},
      {"input": "strength", "flag": "--strength", "optional": true}
    ]
  },
  "conditions": [
    {"input": "model", "kind": "requires_input"},
    {"input": "mode", "kind": "requires_input"},
    {"input": "execution", "kind": "requires_input"},
    {"input": "prompt", "kind": "requires_input"},
    {"input": "image_ref", "kind": "requires_input"}
  ],
  "description": "Unified bounded cloud image edit capability with source-only, mask, and Klein profiles.",
  "graph": {"consumes": ["prompt", "image_ref", "mask_ref"], "provides": ["generated_images", "image_manifest"]},
  "id": "generation.generate_image_edit",
  "name": "Bounded Cloud Image Edit",
  "inputs": [
    {"name": "model", "required": true, "type": "string"},
    {"name": "mode", "required": true, "type": "string"},
    {"name": "execution", "required": true, "type": "string"},
    {"name": "prompt", "required": true, "type": "string", "artifact_type": "prompt"},
    {"name": "image_ref", "required": true, "type": "file", "artifact_type": "image"},
    {"name": "mask_ref", "required": false, "type": "file", "artifact_type": "image"},
    {"name": "count", "default": 1, "required": false, "type": "integer"},
    {"name": "size", "required": true, "type": "string"},
    {"name": "strength", "required": false, "type": "number"},
    {"name": "seed", "default": 0, "required": false, "type": "integer"}
  ],
  "isolation": {"mode": "subprocess", "network": true},
  "kind": "built_in",
  "metadata": {
    "output_result_manifest": true,
    "api_provider": "fal",
    "env": ["FAL_KEY"],
    "secrets_required": ["FAL_KEY"],
    "storage_estimate_required": true,
    "storage_estimate_exact": true,
    "fixed_inputs": {"execution": "cloud"},
    "storage_input_max_bytes": {"image_ref": 512000, "mask_ref": 512000},
    "storage_policy_version": "astrid.cloud-edit.unified.v1",
    "estimated_scratch_bytes": 137338880,
    "estimated_output_bytes": 68157440,
    "hc04_param_ports": ["model", "mode", "execution", "prompt", "image_ref", "mask_ref", "count", "size", "strength", "seed"],
    "hc04_cas_param_ports": ["image_ref", "mask_ref"],
    "network_policy": {
      "allowed_protocols": ["dns", "tcp"],
      "allowed_destinations": ["queue.fal.run:443", "fal.run:443", "fal.media:443", "v3b.fal.media:443", "storage.fal.run:443"],
      "allow_redirects": false,
      "broker": {"host_managed": true, "kind": "broker", "enforced": true, "observable": true, "route": "declared-http-routes", "wrapper": "astrid-generic-host"},
      "descendant_enforcement": {"kind": "broker", "validated": true, "observable": true, "route": "declared-http-routes", "wrapper": "astrid-generic-host"}
    }
  },
  "outputs": [
    {"name": "generated_images", "type": "file", "artifact_type": "image", "mode": "create_or_replace"},
    {"name": "image_manifest", "path_template": "{out}/manifest.json", "type": "file", "artifact_type": null, "mode": "create_or_replace"}
  ],
  "scoped_configs": ["credentials.fal"],
  "short_description": "One bounded typed cloud edit task with source/mask CAS custody.",
  "version": "1.0"
}
