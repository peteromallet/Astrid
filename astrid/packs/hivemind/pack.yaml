schema_version: 2
id: hivemind
name: Hivemind
version: 2.0.0
status: active
domain: integration
stability: experimental
support: community
visibility: visible
permissions:
  - id: network
    reason: Executors call the public Hivemind Supabase REST API for read-only corpus search and retrieval.
  - id: environment
    reason: Reads optional endpoint overrides; write operations require a declared contributor credential.
  - id: subprocess
    reason: YouTube ingest uses yt-dlp for caption extraction.
description: >
  Read-only Hivemind corpus access for Banodoco community knowledge:
  search messages, resources, and distillations, then retrieve full items
  with citation context.
keywords:
  - hivemind
  - knowledge
  - corpus
  - search
  - distillation
  - supabase
  - postgrest
capabilities:
  - search_corpus
  - get_item
  - refresh_media
  - contribute_resource
  - contribute_distillation
  - ingest_article
  - ingest_workflow
  - ingest_youtube
agent:
  purpose: >
    Use when you need community knowledge about generative video and image
    tooling, including workflow tips, settings, gotchas, and cited sources.
  do_not_use_for: >
    Do not write directly to corpus tables. Contribution and ingest writes go
    through the locked edge-function path and require an explicit contributor
    key. Use official documentation for authoritative product specifications.
  normal_entrypoints:
    - hivemind.search
    - hivemind.get_item
    - hivemind.refresh_media
    - hivemind.contribute
    - hivemind.ingest_article
    - hivemind.ingest_workflow
    - hivemind.ingest_youtube
content:
  executors: executors
