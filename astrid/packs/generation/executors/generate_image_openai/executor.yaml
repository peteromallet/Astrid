{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.generation.executors.generate_image_openai.run",
      "--prompts-file",
      "{prompts_file}",
      "--out-dir",
      "{out}/images",
      "--manifest",
      "{out}/manifest.json"
    ]
  },
  "conditions": [
    {
      "input": "prompts_file",
      "kind": "requires_input"
    }
  ],
  "description": "Generate image files with OpenAI GPT Image models from a prompt file.",
  "graph": {
    "consumes": [
      "image_prompts"
    ],
    "provides": [
      "generated_images",
      "image_manifest"
    ]
  },
  "id": "generation.generate_image_openai",
  "inputs": [
    {
      "description": "Text, JSON, or JSONL prompt list consumed by astrid.packs.generation.executors.generate_image_openai.run.",
      "name": "prompts_file",
      "required": true,
      "type": "file",
      "artifact_type": "prompt"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "image",
    "generate",
    "openai",
    "gpt-image",
    "prompt",
    "render"
  ],
  "kind": "built_in",
  "metadata": {
    "output_result_manifest": true,
    "requires_timeline": false,
    "api_provider": "openai",
    "env": [
      "OPENAI_API_KEY"
    ],
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.generation.executors.generate_image_openai.run",
    "manifest_version": 2,
    "manifest_schema": "universal",
    "manifest_note": "Writes a v2 universal manifest object with schema_version, kind, inputs, outputs, created, warnings, and jobs. Output metadata is enriched through the shared result-manifest contract (complete_output_metadata).",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.openai.com:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "name": "Generate Image (OpenAI)",
  "outputs": [
    {
      "description": "Generated image files identified by typed receipt entries.",
      "mode": "create_or_replace",
      "name": "generated_images",
      "type": "file",
      "artifact_type": "image"
    },
    {
      "description": "JSON manifest of the generation run (v2 universal manifest object).",
      "mode": "create_or_replace",
      "name": "image_manifest",
      "path_template": "{out}/manifest.json",
      "type": "file",
      "artifact_type": null
    }
  ],
  "short_description": "Generate image files with OpenAI GPT Image models from a prompt file.",
  "version": "2.0"
}
