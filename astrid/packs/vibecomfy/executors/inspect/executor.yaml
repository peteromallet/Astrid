{
  "schema_version": 1,
  "id": "vibecomfy.inspect",
  "name": "VibeComfy Inspect",
  "kind": "external",
  "version": "1.0.0",
  "short_description": "Render a ComfyUI UI graph as readable Python-like VibeComfy IR.",
  "description": "Read an admitted UI workflow or canonical Python/companion/source bundle without mutation and emit the VibeComfy census, readable surface, and complete computed topology.",
  "keywords": ["comfyui", "vibecomfy", "workflow", "inspect", "ir"],
  "inputs": [
    {"name": "workflow", "type": "file", "required": false, "default": "", "artifact_type": "vibecomfy/ui-workflow", "description": "Optional runtime-admitted ComfyUI UI workflow JSON."},
    {"name": "python", "type": "file", "required": false, "default": "", "artifact_type": "text/x-python", "description": "Optional canonical workflow.py bundle member."},
    {"name": "companion", "type": "file", "required": false, "default": "", "artifact_type": "application/json", "description": "Optional canonical workflow.vibe.json bundle member."},
    {"name": "source", "type": "file", "required": false, "default": "", "artifact_type": "application/json", "description": "Optional byte-identical source.json bundle member."}
  ],
  "outputs": [
    {"name": "projection", "type": "file", "path_template": "{out}/workflow-ir.py", "artifact_type": "text/x-python", "description": "Read-only Python-like IR projection."},
    {"name": "inspection", "type": "file", "path_template": "{out}/inspection.json", "artifact_type": "vibecomfy/ir-inspection", "description": "Structured census, surface, topology, and authority metadata."}
  ],
  "command": {
    "argv": ["{python_exec}", "-m", "astrid.packs.vibecomfy.executors.inspect.run", "--workflow", "{workflow}", "--python", "{python}", "--companion", "{companion}", "--source", "{source}", "--out", "{out}"]
  },
  "cache": {"mode": "none"},
  "graph": {"consumes": ["workflow", "python", "companion", "source"], "provides": ["vibecomfy_ir_projection"]},
  "isolation": {"mode": "subprocess", "network": false, "requirements": ["vibecomfy"]},
  "metadata": {
    "pack_id": "vibecomfy",
    "runtime_module": "astrid.packs.vibecomfy.executors.inspect.run",
    "runtime_file": "run.py",
    "vibecomfy_command": "inspect_ir",
    "authority": "input_ui_graph_or_canonical_bundle",
    "mutation": "none"
  }
}
