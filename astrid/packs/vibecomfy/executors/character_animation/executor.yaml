{
  "schema_version": 1,
  "cache": {"mode": "none"},
  "command": {
    "argv": [
      "{python_exec}", "-m", "astrid.packs.vibecomfy.media.run",
      "--capability", "vibecomfy.character_animation", "--profile", "pip_embedded",
      "--task-identity", "{task_identity}",
      "--readiness-profile-path", "{readiness_profile_path}",
      "--readiness-profile-hash", "{readiness_profile_hash}", "--out", "{out}",
      "--reference-image-ref", "{reference_image_ref}", "--driving-video-ref", "{driving_video_ref}",
      "--mode", "{mode}", "--resolution", "{resolution}", "--prompt", "{prompt}", "--seed", "{seed}"
    ]
  },
  "conditions": [
    {"input": "reference_image_ref", "kind": "requires_input"},
    {"input": "driving_video_ref", "kind": "requires_input"}
  ],
  "description": "Bounded typed Wan 2.2 Animate execution with ordered image/video CAS custody; animate mode is admitted and replacement mode is fail-closed.",
  "graph": {"consumes": ["reference_image_ref", "driving_video_ref"], "provides": ["animated_video", "video_manifest"]},
