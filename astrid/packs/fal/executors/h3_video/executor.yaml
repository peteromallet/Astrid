{
  "schema_version": 1,
  "id": "fal.h3_video",
  "name": "fal MiniMax H3 video",
  "kind": "external",
  "version": "0.1.0",
  "short_description": "Generate MiniMax H3 text-to-video or multimodal reference-to-video clips through fal.ai.",
  "description": "Validates and stages an exact prompt plus optional ordered image, video, and audio references; calls the appropriate MiniMax H3 fal.ai endpoint; downloads the 2K result; and emits a provenance manifest.",
  "keywords": ["fal", "minimax", "h3", "hailuo-03", "text-to-video", "reference-to-video", "video"],
  "inputs": [
    {
      "name": "mode",
      "type": "string",
      "required": true,
      "description": "H3 endpoint mode: text-to-video or reference-to-video."
    },
    {
      "name": "prompt_file",
      "type": "file",
      "required": true,
      "description": "UTF-8 prompt file, captured exactly; H3 accepts at most 2,000 characters."
    },
    {
      "name": "image_ref",
      "type": "file",
      "required": false,
      "repeatable": true,
      "description": "Ordered image reference for reference-to-video; repeat up to nine times."
    },
    {
      "name": "video_ref",
      "type": "file",
      "required": false,
      "repeatable": true,
      "description": "Ordered video reference for reference-to-video; repeat up to three times."
    },
    {
      "name": "audio_ref",
      "type": "file",
      "required": false,
      "repeatable": true,
      "description": "Ordered audio reference for reference-to-video; repeat up to three times."
    },
    {
      "name": "duration",
      "type": "integer",
      "required": false,
      "default": 15,
      "description": "Generated duration from 5 through 15 seconds."
    },
    {
      "name": "aspect_ratio",
      "type": "string",
      "required": false,
      "default": "16:9",
      "description": "Output aspect ratio. Reference mode also accepts adaptive."
    },
    {
      "name": "env_file",
      "type": "file",
      "required": false,
      "description": "Optional env file containing FAL_KEY."
    },
    {
      "name": "timeout_seconds",
      "type": "integer",
      "required": false,
      "default": 3600,
      "description": "Bounded fal queue and download timeout."
    },
    {
      "name": "dry_run",
      "type": "boolean",
      "required": false,
      "default": false,
      "description": "Stage and validate without submitting a paid request."
    }
  ],
  "outputs": [
    {
      "name": "generated_videos",
      "type": "file",
      "artifact_type": "video/clip",
      "description": "Generated H3 video identified by its typed receipt entry.",
      "mode": "create_or_replace"
    },
    {
      "name": "video_manifest",
      "type": "file",
      "path_template": "{out}/manifest.json",
      "artifact_type": null,
      "description": "Exact prompt, staged references, request record, and typed generated-video receipt.",
      "mode": "create_or_replace"
    }
  ],
  "graph": {
    "consumes": ["prompt", "appearance_reference", "motion_reference", "audio_reference"],
    "depends_on": [],
    "provides": ["generation_result_manifest"]
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "secrets_required": ["FAL_KEY"],
    "requirements": ["PyYAML>=6,<7"]
  },
  "cache": {"mode": "none"},
  "conditions": [
    {"kind": "requires_input", "input": "mode"},
    {"kind": "requires_input", "input": "prompt_file"}
  ],
  "command": {
    "argv": ["{python_exec}", "-m", "astrid.packs.fal.executors.h3_video.run", "--out", "{out}"]
  },
  "metadata": {
    "output_result_manifest": true,
    "requires_timeline": false,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.fal.executors.h3_video.run",
    "fal_model_ids": ["minimax/h3/text-to-video", "minimax/h3/reference-to-video"],
    "pricing_note": "At creation time, public fal launch pricing states $0.26 per generated second at 2K.",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["queue.fal.run:443","fal.run:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}},
  "scoped_configs": ["credentials.fal"]
}
